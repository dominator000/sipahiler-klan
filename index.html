<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>亗SİPAHİLER亗 Clan Başvuru</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(rgba(0, 0, 0, 0.75), rgba(15, 17, 26, 0.9)), url('130858.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: rgba(20, 20, 20, 0.85);
            border: 1px solid rgba(220, 20, 60, 0.4);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(220, 20, 60, 0.3);
            text-align: center;
        }
        h1 {
            color: #ff1e38;
            font-size: 24px;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(255, 30, 56, 0.5);
            letter-spacing: 2px;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #444;
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }
        input:focus {
            border-color: #ff1e38;
            box-shadow: 0 0 8px rgba(255, 30, 56, 0.4);
        }
        button {
            background: linear-gradient(135deg, #ff1e38, #b3001b);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        button:hover {
            background: linear-gradient(135deg, #ff3852, #d10022);
            box-shadow: 0 0 15px rgba(255, 30, 56, 0.6);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>亗SİPAHİLER亗</h1>
        <form onsubmit="sendToWhatsApp(event)">
            <input type="text" id="oyunAdi" placeholder="Oyun İçi Adın (Nick)" required>
            <input type="number" id="yas" placeholder="Yaşın" required>
            <input type="text" id="tecrube" placeholder="Daha Önceki Klanların / Tecrübe" required>
            <button type="submit">WhatsApp ile Başvuru Gönder</button>
        </form>
    </div>

    <script>
        function sendToWhatsApp(event) {
            event.preventDefault();
            
            const phoneNumber = "905444602137"; // Senin numaran
            const oyunAdi = document.getElementById("oyunAdi").value;
            const yas = document.getElementById("yas").value;
            const tecrube = document.getElementById("tecrube").value;

            const mesaj = `👑 *Yeni Klan Başvurusu!* 👑\n\n👤 *Adı:* ${oyunAdi}\n🎂 *Yaş:* ${yas}\n⚔️ *Tecrübe:* ${tecrube}`;
            const url = `https://api.whatsapp.com/send?phone=${phoneNumber}&text=${encodeURIComponent(mesaj)}`;

            window.open(url, "_blank");
        }
    </script>
</body>
</html>
